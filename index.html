<script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const uploadText = document.getElementById('uploadText');
    const analyzeBtn = document.getElementById('analyzeBtn');
    let selectedFile = null;

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            compressImage(file, (compressedBlob) => {
                selectedFile = compressedBlob;
                preview.src = URL.createObjectURL(compressedBlob);
                preview.style.display = 'block';
                uploadText.style.display = 'none';
                analyzeBtn.style.display = 'block';
                document.getElementById('results').style.display = 'none';
            });
        }
    });

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                // Max dimension limit for free tier RAM protection
                const MAX_DIMENSION = 800;
                if (width > height) {
                    if (width > MAX_DIMENSION) {
                        height *= MAX_DIMENSION / width;
                        width = MAX_DIMENSION;
                    }
                } else {
                    if (height > MAX_DIMENSION) {
                        width *= MAX_DIMENSION / height;
                        height = MAX_DIMENSION;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                canvas.toBlob((blob) => {
                    callback(blob);
                }, 'image/jpeg', 0.7); // 70% quality compression
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function uploadImage() {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append('file', selectedFile, 'image.jpg');

        document.getElementById('loadingText').style.display = 'block';
        analyzeBtn.style.display = 'none';
        document.getElementById('results').style.display = 'none';

        try {
            const response = await fetch('/extract-yolo', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                throw new Error('Server processing failed');
            }

            const data = await response.json();
            
            document.getElementById('loadingText').style.display = 'none';
            analyzeBtn.style.display = 'block';

            const output = data.agent_output;
            document.getElementById('resultSummary').innerText = output.summary;
            
            const metaGrid = document.getElementById('metaGrid');
            const m = output.image_metadata;
            const rgb = output.color_profile.average_rgb;
            metaGrid.innerHTML = `
                <div><b>Dimensions:</b> ${m.width_pixels} x ${m.height_pixels} px</div>
                <div><b>Format:</b> ${m.format} (${m.color_mode})</div>
                <div style="grid-column: span 2;"><b>Avg RGB Tone:</b> R:${rgb[0]} G:${rgb[1]} B:${rgb[2]}</div>
            `;

            const listContainer = document.getElementById('featureList');
            listContainer.innerHTML = '';
            
            if(output.detailed_features.length === 0) {
                listContainer.innerHTML = '<span style="color:#8e918f;">No distinct objects recognized.</span>';
            } else {
                output.detailed_features.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'feature-card';
                    card.innerHTML = `
                        <span>🏷️ <b>${item.feature_name}</b></span>
                        <span style="color: #a8c7fa; font-weight: 500;">Confidence: ${item.confidence_score}</span>
                    `;
                    listContainer.appendChild(card);
                });
            }
            document.getElementById('results').style.display = 'block';

        } catch (err) {
            alert('Error processing image. Please try again.');
            document.getElementById('loadingText').style.display = 'none';
            analyzeBtn.style.display = 'block';
        }
    }
</script>
