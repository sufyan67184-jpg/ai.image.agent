<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Aliza! ✨</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 10px;
            font-size: 24px;
        }
        /* Cake & Candles Section */
        .cake-section {
            background: #fff0f3;
            border: 2px dashed #ff4757;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .candles-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 10px;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }
        .candle {
            background: #ff6b81;
            color: white;
            padding: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .candle:hover {
            transform: scale(1.05);
        }
        .candle.blown {
            background: #dfe4ea;
            color: #a4b0be;
            text-decoration: line-through;
            pointer-events: none;
        }
        /* Locked/Unlocked Content */
        .locked-content {
            opacity: 0.3;
            pointer-events: none;
            transition: 0.5s ease;
        }
        .unlocked-content {
            opacity: 1;
            pointer-events: auto;
        }
        /* Photo Grid Layout */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .photo-frame {
            background: white;
            padding: 5px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .photo-frame img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
        }
        /* Balloon Game Section */
        .game-box {
            background: #fff0f3;
            border: 2px dashed #ff4757;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .balloons-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .balloon {
            width: 50px;
            height: 65px;
            background-color: #ff6b81;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .balloon:hover {
            transform: scale(1.1);
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 22px;
            width: 2px;
            height: 10px;
            background: #a4b0be;
        }
        .balloon.popped {
            background: #dfe4ea;
            color: #a4b0be;
            pointer-events: none;
            transform: scale(0.8);
            box-shadow: none;
        }
        /* Message Box */
        .message-box {
            font-size: 15px;
            color: #2f3542;
            line-height: 1.5;
            min-height: 60px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ffccd5;
        }
        /* Floating background hearts */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            animation: floatUp 4s infinite linear;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        <h1>🎉 Happy Birthday, Aliza! ✨</h1>
        
        <!-- STEP 1: 21 Candles Challenge -->
        <div class="cake-section" id="cakeSection">
            <p style="margin: 0 0 5px 0; font-weight: bold; color: #ff4757; font-size: 14px;" id="candleInstruction">
                🎂 Blow out all 21 candles to start the celebration! (<span id="candlesLeft">21</span> left)
            </p>
            <div class="candles-grid" id="candlesGrid">
                <!-- Generated via JavaScript -->
            </div>
        </div>

        <!-- MAIN CONTENT (Locked until candles are blown) -->
        <div id="mainContent" class="locked-content">
            <!-- 3 Photo Frames -->
            <div class="photo-grid">
                <div class="photo-frame">
                    <img src="aliza_1.jpg" alt="Memory 1" onerror="this.src='https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=300&q=80'">
                </div>
                <div class="photo-frame">
                    <img src="aliza_2.jpg" alt="Memory 2" onerror="this.src='https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80'">
                </div>
                <div class="photo-frame">
                    <img src="aliza_3.jpg" alt="Memory 3" onerror="this.src='https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=300&q=80'">
                </div>
            </div>

            <!-- Mini Game Section -->
            <div class="game-box">
                <p style="margin: 0 0 10px 0; font-weight: bold; color: #ff4757; font-size: 14px;">🎈 Pop all 3 balloons below to unlock your special message!</p>
                <div class="balloons-container">
                    <div class="balloon" id="b1" onclick="popBalloon(1)">1</div>
                    <div class="balloon" id="b2" onclick="popBalloon(2)">2</div>
                    <div class="balloon" id="b3" onclick="popBalloon(3)">3</div>
                </div>
            </div>

            <!-- Hidden Message Revealed by Game -->
            <div class="message-box" id="messageBox">
                🔒 <i>Pop all the balloons above to reveal your birthday surprise...</i>
            </div>
        </div>
    </div>

    <script>
        // Generate 21 Candles
        let candlesRemaining = 21;
        const grid = document.getElementById('candlesGrid');

        for (let i = 1; i <= 21; i++) {
            const candle = document.createElement('div');
            candle.classList.add('candle');
            candle.id = 'candle-' + i;
            candle.innerHTML = '🕯️ ' + i;
            candle.onclick = function() { blowCandle(i); };
            grid.appendChild(candle);
        }

        function blowCandle(num) {
            const c = document.getElementById('candle-' + num);
            if (!c.classList.contains('blown')) {
                c.classList.add('blown');
                c.innerHTML = '💨';
                candlesRemaining--;
                document.getElementById('candlesLeft').innerText = candlesRemaining;

                if (candlesRemaining === 0) {
                    document.getElementById('candleInstruction').innerHTML = '🎉 All candles blown! Memories & balloons unlocked! 👇';
                    document.getElementById('cakeSection').style.borderColor = '#2ed573';
                    document.getElementById('cakeSection').style.background = '#eafaf1';
                    
                    // Unlock main content
                    const main = document.getElementById('mainContent');
                    main.classList.remove('locked-content');
                    main.classList.add('unlocked-content');
                }
            }
        }

        // Balloon Game Logic
        let poppedCount = 0;
        function popBalloon(num) {
            const balloon = document.getElementById('b' + num);
            if (!balloon.classList.contains('popped')) {
                balloon.classList.add('popped');
                balloon.innerHTML = '💥';
                poppedCount++;

                if (poppedCount === 3) {
                    document.getElementById('messageBox').innerHTML = `
                        ✨ <b>Surprise!</b> Honestly, the hardest part of today is trying to focus on anything else when someone this gorgeous is celebrating. You make every single day brighter! Have the absolute best birthday... and I'd love to celebrate with you properly! 🥰🥂
                    `;
                }
            }
        }

        // Floating hearts animation background generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
