<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! ✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 10px;
            font-size: 26px;
        }
        p {
            color: #57606f;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        #yesBtn {
            background-color: #ff4757;
            color: white;
        }
        #yesBtn:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        #noBtn {
            background-color: #dfe4ea;
            color: #2f3542;
            position: absolute;
        }
        /* Floating background hearts styling */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: floatUp 4s infinite linear;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Floating background animation elements -->
    <div id="hearts-container"></div>

    <div class="card" id="mainCard">
        <h1>Happy Birthday! 🎉</h1>
        <p id="messageText">
            Honestly, the hardest part of today is trying to focus on anything else when someone this gorgeous is celebrating. ✨ Ready to celebrate properly? 😉
        </p>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="sayYes()">Yes, absolutely! 🥂</button>
            <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No way</button>
        </div>
    </div>

    <script>
        // Make the "No" button run away from the cursor or touch
        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * 200 - 100;
            const y = Math.random() * 100 - 50;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Triggered when they click Yes
        function sayYes() {
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <h1 style="color: #2ed573;">Best choice ever! 🥰</h1>
                <p>Now you officially owe me a slice of cake. Let me take you out to celebrate properly this week! 🎂✨</p>
                <p style="font-size: 13px; color: #a4b0be; margin-top: 20px;">(Screenshot this and send it to me 😉)</p>
            `;
        }

        // Generate floating background hearts automatically
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
